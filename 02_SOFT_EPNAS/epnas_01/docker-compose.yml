services:
  web:
    build: .
    container_name: epnas_01_web
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - static_data:/app/staticfiles
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-epnas-01-dev-change-this-key-before-production}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-true}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-*}"
      EPNAS_DB_NAME: "${EPNAS_DB_NAME:-productos_bm}"
      EPNAS_DB_USER: "${EPNAS_DB_USER:-}"
      EPNAS_DB_PASSWORD: "${EPNAS_DB_PASSWORD:-}"
      EPNAS_DB_HOST: "${EPNAS_DB_HOST:-127.0.0.1}"
      EPNAS_DB_PORT: "${EPNAS_DB_PORT:-5432}"
      EPNAS_DB_SCHEMA: "${EPNAS_DB_SCHEMA:-epnas}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: epnas_01_nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro

volumes:
  static_data:
